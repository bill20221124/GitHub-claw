# Proactive Watch — daily repository health scan.
# Runs scan_repo.py every day at 09:00 UTC; opens a GitHub issue if findings exist.
# See AGENT-COLLAB.md §7 (T-006) for full specification.
name: Proactive Watch

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run proactive scan
        id: scan
        run: |
          set +e
          python scripts/scan_repo.py > /tmp/scan_report.md 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/scan_report.md

      - name: Open issue if findings detected
        if: steps.scan.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="agent-watch"
          if ! gh label create "$LABEL" \
            --color "0E8A16" \
            --description "Automated proactive watch findings" \
            --force; then
            echo "Warning: failed to ensure label '$LABEL'. Will attempt issue creation; may fallback to unlabeled."
          fi

          TITLE="[Agent Watch] $(date -u +%Y-%m-%d) 巡视报告"
          SEARCH_QUERY="repo:${GITHUB_REPOSITORY} is:issue is:open in:title \"$TITLE\""
          EXISTS="$(gh api --method GET search/issues -f q="$SEARCH_QUERY" -q '.total_count')"
          if [ "$EXISTS" -gt 0 ]; then
            echo "Open issue already exists for title: $TITLE"
            exit 0
          fi

          if ! gh issue create \
            --title "$TITLE" \
            --label "$LABEL" \
            --body-file /tmp/scan_report.md; then
            echo "Label application failed, retrying issue creation without label."
            if ! gh issue create \
              --title "$TITLE" \
              --body-file /tmp/scan_report.md; then
              echo "Error: failed to create proactive watch issue even without label."
              exit 1
            fi
          fi
